# golangci-lint configuration
# See https://golangci-lint.run/usage/configuration/

version: 2

linters-settings:
  govet:
    enable-all: true

linters:
  # Use default linters: errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errcheck      # Check for unchecked errors (enabled by default)
    - govet         # Examines Go source code (enabled by default)
    - ineffassign   # Detect ineffectual assignments (enabled by default)
    - staticcheck   # Go static analysis (enabled by default)
    - unused        # Check for unused code (enabled by default)
    - gocritic      # Additional diagnostics for bugs, performance, and style

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
